<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="Meiryo, 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="13">
  <rect width="520" height="230" fill="#ffffff"/>
  <text x="20" y="24" font-weight="bold" fill="#222">ゲージ径の比較（正面から見た円。大きさの比は実寸どおり）</text>
  <circle cx="80"  cy="120" r="31.75" fill="#aed6f1" stroke="#1f618d" stroke-width="1.5"/>
  <circle cx="210" cy="120" r="44.45" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
  <circle cx="390" cy="120" r="69.85" fill="#f5cba7" stroke="#a04000" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="80"  y="215">30番 φ31.75</text>
    <text x="210" y="215">40番 φ44.45</text>
    <text x="390" y="215">50番 φ69.85</text>
    <text x="80"  y="124" font-size="11">小型・高速</text>
    <text x="210" y="124" font-size="11">汎用</text>
    <text x="390" y="124" font-size="11">重切削・大型</text>
  </g>
</svg>
